---
layout: default
---

<style>
.post-wrapper {
  display: grid;
  grid-template-columns: 1fr 250px;
  gap: 2rem;
  align-items: start;
}

.post-content {
  grid-column: 1;
}

.post-toc-container {
  grid-column: 2;
  grid-row: 1;
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
}

.post-toc-container nav {
  background-color: #f5f5f5;
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 1rem;
  font-size: 0.9rem;
}

.post-toc-container nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.post-toc-container nav ul ul {
  padding-left: 1rem;
  margin-top: 0.25rem;
}

.post-toc-container nav li {
  margin: 0.25rem 0;
}

.post-toc-container nav a {
  color: #2d5016;
  text-decoration: none;
}

.post-toc-container nav a:hover {
  text-decoration: underline;
}

.post-toc-container h4 {
  margin: 0 0 0.5rem 0;
}

@media (max-width: 900px) {
  .post-wrapper {
    grid-template-columns: 1fr;
  }
  
  .post-toc-container {
    grid-column: 1;
    position: static;
    max-height: none;
    margin-bottom: 2rem;
  }
}
</style>

<div class="post-wrapper">
  <div class="post-content">
    <small>{{ page.date | date: "%d %B %Y" }}</small>
    {{ content }}
  </div>
  
  <div class="post-toc-container" id="toc-container"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const postContent = document.querySelector('.post-content');
  const tocContainer = document.getElementById('toc-container');
  
  // Get all headings from the content
  const headings = postContent.querySelectorAll('h2, h3, h4');
  
  if (headings.length === 0) {
    tocContainer.style.display = 'none';
    return;
  }
  
  // Create the TOC structure
  const nav = document.createElement('nav');
  let currentLevel = 0;
  let currentList = null;
  const listStack = [];
  
  headings.forEach((heading, index) => {
    const level = parseInt(heading.tagName[1]);
    
    // Set an ID if the heading doesn't have one
    if (!heading.id) {
      heading.id = 'heading-' + index;
    }
    
    // Create a link
    const link = document.createElement('a');
    link.href = '#' + heading.id;
    link.textContent = heading.textContent;
    
    // Create a list item
    const li = document.createElement('li');
    li.appendChild(link);
    
    // Handle nesting
    if (level > currentLevel) {
      // Create new nested lists
      for (let i = currentLevel; i < level; i++) {
        const newList = document.createElement('ul');
        if (currentList) {
          currentList.appendChild(newList);
        } else {
          nav.appendChild(newList);
        }
        listStack.push(currentList);
        currentList = newList;
      }
    } else if (level < currentLevel) {
      // Pop back to the correct level
      for (let i = level; i < currentLevel; i++) {
        currentList = listStack.pop();
      }
    }
    
    currentLevel = level;
    currentList.appendChild(li);
  });
  
  // Add the nav to the container
  if (headings.length > 0) {
    const title = document.createElement('h4');
    title.textContent = 'Contents';
    tocContainer.appendChild(title);
    tocContainer.appendChild(nav);
  } else {
    tocContainer.style.display = 'none';
  }
});
</script>
