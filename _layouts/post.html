---
layout: default
---

<style>
.header-toc nav {
  background-color: #f5f5f5;
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 1rem;
  font-size: 0.9rem;
  margin-top: 1rem;
}

.header-toc nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.header-toc nav ul ul {
  padding-left: 1rem;
  margin-top: 0.25rem;
}

.header-toc nav li {
  margin: 0.25rem 0;
}

.header-toc nav a {
  color: #2d5016;
  text-decoration: none;
}

.header-toc nav a:hover {
  text-decoration: underline;
}

.header-toc h4 {
  margin: 0 0 0.5rem 0;
}
</style>

<small>{{ page.date | date: "%d %B %Y" }}</small>
{{ content }}

<script>
document.addEventListener('DOMContentLoaded', function() {
  const section = document.querySelector('section');
  const headerTocContainer = document.getElementById('header-toc');
  
  // Get all headings from the content
  const headings = section.querySelectorAll('h2, h3, h4');
  
  if (headings.length === 0) {
    headerTocContainer.style.display = 'none';
    return;
  }
  
  // Create the TOC structure
  const nav = document.createElement('nav');
  let currentLevel = 0;
  let currentList = null;
  const listStack = [];
  
  headings.forEach((heading, index) => {
    const level = parseInt(heading.tagName[1]);
    
    // Set an ID if the heading doesn't have one
    if (!heading.id) {
      heading.id = 'heading-' + index;
    }
    
    // Create a link
    const link = document.createElement('a');
    link.href = '#' + heading.id;
    link.textContent = heading.textContent;
    
    // Create a list item
    const li = document.createElement('li');
    li.appendChild(link);
    
    // Handle nesting
    if (level > currentLevel) {
      // Create new nested lists
      for (let i = currentLevel; i < level; i++) {
        const newList = document.createElement('ul');
        if (currentList) {
          currentList.appendChild(newList);
        } else {
          nav.appendChild(newList);
        }
        listStack.push(currentList);
        currentList = newList;
      }
    } else if (level < currentLevel) {
      // Pop back to the correct level
      for (let i = level; i < currentLevel; i++) {
        currentList = listStack.pop();
      }
    }
    
    currentLevel = level;
    currentList.appendChild(li);
  });
  
  // Add the nav to the container
  if (headings.length > 0) {
    const title = document.createElement('h4');
    title.textContent = 'Contents';
    headerTocContainer.appendChild(title);
    headerTocContainer.appendChild(nav);
  } else {
    headerTocContainer.style.display = 'none';
  }
});
</script>
